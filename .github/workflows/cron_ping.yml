name: Daily Cron Ping

# GitHub Actions cron uses UTC.
# 10:17 IST = 04:47 UTC. Adjust if a different timezone is intended.
#
# The minute is deliberately NOT a round number (:00/:15/:30/:45).
# GitHub's docs warn scheduled workflows can be delayed or dropped
# during high-load periods, and "the start of every hour" is called
# out as high-load - an odd offset avoids that pile-up.
# https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#schedule
on:
  schedule:
    - cron: "47 4 * * *" # 10:17 IST daily
    - cron: "15 6 * * *" # TEMP test slot - 11:45 IST - remove after today
    - cron: "0 7 * * *"  # TEMP test slot - 12:30 IST - remove after today
    - cron: "0 9 * * *"  # TEMP test slot - 14:30 IST - remove after today
    - cron: "0 12 * * *" # TEMP test slot - 17:30 IST - remove after today
    - cron: "0 15 * * *" # TEMP test slot - 20:30 IST - remove after today
  workflow_dispatch: {}

jobs:
  ping:
    name: Call API endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Call API
        run: python cron_ping/main.py
