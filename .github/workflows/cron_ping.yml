name: Daily Cron Ping

# GitHub Actions cron uses UTC.
# 10:17 IST = 04:47 UTC. Adjust if a different timezone is intended.
#
# The minute is deliberately NOT a round number (:00/:15/:30/:45).
# GitHub's docs warn scheduled workflows can be delayed or dropped
# during high-load periods, and "the start of every hour" is called
# out as high-load - an odd offset avoids that pile-up.
# https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#schedule
on:
  schedule:
    - cron: "47 4 * * *" # 10:17 IST daily
    - cron: "17 6 * * *"  # TEMP test slot - 11:47 IST - remove after today
    - cron: "3 7 * * *"   # TEMP test slot - 12:33 IST - remove after today
    - cron: "8 9 * * *"   # TEMP test slot - 14:38 IST - remove after today
    - cron: "12 12 * * *" # TEMP test slot - 17:42 IST - remove after today
    - cron: "17 15 * * *" # TEMP test slot - 20:47 IST - remove after today
  workflow_dispatch: {}

jobs:
  ping:
    name: Call API endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Call API
        run: python cron_ping/main.py

      # ------------------------------------------------------------
      # Dead-man's-switch monitoring (healthchecks.io). See the
      # matching step in daily.yml for why this exists. Only pings
      # on the permanent slot / manual runs, not the TEMP test slots.
      # No-op if HEALTHCHECK_URL_CRONPING secret isn't set.
      # ------------------------------------------------------------
      - name: Ping healthcheck (real runs only)
        if: >-
          ${{ always() && secrets.HEALTHCHECK_URL_CRONPING != '' &&
          github.event.schedule != '17 6 * * *' &&
          github.event.schedule != '3 7 * * *' &&
          github.event.schedule != '8 9 * * *' &&
          github.event.schedule != '12 12 * * *' &&
          github.event.schedule != '17 15 * * *' }}
        run: |
          url="${{ secrets.HEALTHCHECK_URL_CRONPING }}"
          if [ "${{ job.status }}" != "success" ]; then
            url="${url}/fail"
          fi
          curl -fsS -m 10 --retry 3 "$url" || echo "Healthcheck ping failed (non-fatal)."
