name: Daily Cron Ping

# No `schedule:` trigger here on purpose. This job has no dedupe
# logic (unlike daily.yml's per-contact-per-year check), so running
# it twice a day for the same target would be a real duplicate API
# call, not just wasted compute. An external scheduler (cron-job.org)
# calls this via workflow_dispatch at 10:17 IST daily instead -
# workflow_dispatch always runs promptly, unlike GitHub's own
# schedule queue which can be delayed by hours or occasionally
# dropped (see daily.yml's comments / ARCHITECTURE.md for the story).
on:
  workflow_dispatch: {}

jobs:
  ping:
    name: Call API endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # `secrets.*` isn't a valid context inside step `if:` conditions
    # (GitHub Actions schema restriction). Exposing it as a job-level
    # env var makes it usable via `env.*` in any step's `if:` below.
    env:
      HEALTHCHECK_URL_CRONPING: ${{ secrets.HEALTHCHECK_URL_CRONPING }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ------------------------------------------------------------
      # Dead-man's-switch: "start" ping - see daily.yml for why this
      # exists (duration tracking + hung-job detection).
      # ------------------------------------------------------------
      - name: Ping healthcheck - start
        if: ${{ env.HEALTHCHECK_URL_CRONPING != '' }}
        run: |
          curl -fsS -m 10 --retry 3 "$HEALTHCHECK_URL_CRONPING/start" \
            || echo "Healthcheck start ping failed (non-fatal)."

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Call API
        run: python cron_ping/main.py | tee "$RUNNER_TEMP/cron_ping_output.txt"

      # ------------------------------------------------------------
      # Dead-man's-switch monitoring (healthchecks.io) - end ping.
      # See the matching step in daily.yml for why this exists. The
      # API's response (captured above) is attached as the ping body
      # so it's visible in healthchecks.io's ping log too. No-op if
      # HEALTHCHECK_URL_CRONPING secret isn't set.
      # ------------------------------------------------------------
      - name: Ping healthcheck - end
        if: ${{ always() && env.HEALTHCHECK_URL_CRONPING != '' }}
        run: |
          url="$HEALTHCHECK_URL_CRONPING"
          if [ "${{ job.status }}" != "success" ]; then
            url="${url}/fail"
          fi
          if [ -f "$RUNNER_TEMP/cron_ping_output.txt" ]; then
            curl -fsS -m 10 --retry 3 --data-binary "@$RUNNER_TEMP/cron_ping_output.txt" "$url" \
              || echo "Healthcheck ping failed (non-fatal)."
          else
            curl -fsS -m 10 --retry 3 "$url" || echo "Healthcheck ping failed (non-fatal)."
          fi
