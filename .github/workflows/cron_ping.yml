name: Daily Cron Ping

# GitHub Actions cron uses UTC.
# 10:17 IST = 04:47 UTC. Adjust if a different timezone is intended.
#
# The minute is deliberately NOT a round number (:00/:15/:30/:45).
# GitHub's docs warn scheduled workflows can be delayed or dropped
# during high-load periods, and "the start of every hour" is called
# out as high-load - an odd offset avoids that pile-up.
# https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#schedule
on:
  schedule:
    - cron: "47 4 * * *" # 10:17 IST daily
    - cron: "1 12 * * *"  # TEMP test slot - 17:31 IST - remove after today
    - cron: "57 12 * * *" # TEMP test slot - 18:27 IST - remove after today
    - cron: "52 13 * * *" # TEMP test slot - 19:22 IST - remove after today
    - cron: "48 14 * * *" # TEMP test slot - 20:18 IST - remove after today
    - cron: "43 15 * * *" # TEMP test slot - 21:13 IST - remove after today
  workflow_dispatch: {}

jobs:
  ping:
    name: Call API endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # `secrets.*` isn't a valid context inside step `if:` conditions
    # (GitHub Actions schema restriction). Exposing it as a job-level
    # env var makes it usable via `env.*` in any step's `if:` below.
    env:
      HEALTHCHECK_URL_CRONPING: ${{ secrets.HEALTHCHECK_URL_CRONPING }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ------------------------------------------------------------
      # Dead-man's-switch: "start" ping - see daily.yml for why this
      # exists (duration tracking + hung-job detection). Only on the
      # permanent slot / manual runs, not the TEMP test slots.
      # ------------------------------------------------------------
      - name: Ping healthcheck - start
        if: >-
          ${{ env.HEALTHCHECK_URL_CRONPING != '' &&
          github.event.schedule != '1 12 * * *' &&
          github.event.schedule != '57 12 * * *' &&
          github.event.schedule != '52 13 * * *' &&
          github.event.schedule != '48 14 * * *' &&
          github.event.schedule != '43 15 * * *' }}
        run: |
          curl -fsS -m 10 --retry 3 "$HEALTHCHECK_URL_CRONPING/start" \
            || echo "Healthcheck start ping failed (non-fatal)."

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Call API
        run: python cron_ping/main.py | tee "$RUNNER_TEMP/cron_ping_output.txt"

      # ------------------------------------------------------------
      # Dead-man's-switch monitoring (healthchecks.io) - end ping.
      # See the matching step in daily.yml for why this exists. Only
      # pings on the permanent slot / manual runs, not the TEMP test
      # slots. The API's response (captured above) is attached as the
      # ping body so it's visible in healthchecks.io's ping log too.
      # No-op if HEALTHCHECK_URL_CRONPING secret isn't set.
      # ------------------------------------------------------------
      - name: Ping healthcheck - end (real runs only)
        if: >-
          ${{ always() && env.HEALTHCHECK_URL_CRONPING != '' &&
          github.event.schedule != '1 12 * * *' &&
          github.event.schedule != '57 12 * * *' &&
          github.event.schedule != '52 13 * * *' &&
          github.event.schedule != '48 14 * * *' &&
          github.event.schedule != '43 15 * * *' }}
        run: |
          url="$HEALTHCHECK_URL_CRONPING"
          if [ "${{ job.status }}" != "success" ]; then
            url="${url}/fail"
          fi
          if [ -f "$RUNNER_TEMP/cron_ping_output.txt" ]; then
            curl -fsS -m 10 --retry 3 --data-binary "@$RUNNER_TEMP/cron_ping_output.txt" "$url" \
              || echo "Healthcheck ping failed (non-fatal)."
          else
            curl -fsS -m 10 --retry 3 "$url" || echo "Healthcheck ping failed (non-fatal)."
          fi
