name: Daily Birthday SMS

# GitHub Actions cron uses UTC.
#
# 18:35 UTC = 00:05 IST (next day).
#
# The workflow intentionally runs shortly AFTER midnight instead of
# starting before midnight and sleeping until midnight.
#
# Flow:
#   00:05 IST
#      ↓
#   GitHub Actions starts
#      ↓
#   Python determines TODAY in BIRTHDAY_TIMEZONE
#      ↓
#   Checks birthdays.csv
#      ↓
#   Sends SMS to today's birthday contacts
#
# This avoids relying on a GitHub Actions runner remaining alive while
# waiting for midnight.

on:
  schedule:
    - cron: "35 18 * * *" # 00:05 IST daily

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render messages and log them WITHOUT sending real SMS"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

# The workflow needs to read the repository and update the sent-state file.
permissions:
  contents: write

# Prevent duplicate workflows from running simultaneously.
concurrency:
  group: daily-birthday-sms
  cancel-in-progress: false

jobs:
  send-birthday-sms:
    name: Check birthdays and send SMS
    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      # ------------------------------------------------------------
      # Checkout repository
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ------------------------------------------------------------
      # Python
      # ------------------------------------------------------------
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # ------------------------------------------------------------
      # Dependencies
      # ------------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      # ------------------------------------------------------------
      # Birthday SMS
      # ------------------------------------------------------------
      - name: Run birthday SMS script
        env:
          # Required secrets
          SMS_GATEWAY_USERNAME: ${{ secrets.SMS_GATEWAY_USERNAME }}
          SMS_GATEWAY_PASSWORD: ${{ secrets.SMS_GATEWAY_PASSWORD }}

          # Optional repository variables
          SMS_GATEWAY_BASE_URL: ${{ vars.SMS_GATEWAY_BASE_URL }}
          BIRTHDAY_TIMEZONE: ${{ vars.BIRTHDAY_TIMEZONE }}

          # Application paths
          BIRTHDAY_CSV_PATH: data/birthdays.csv
          STATE_FILE_PATH: data/.sent_state.json

          # Logging
          LOG_LEVEL: INFO

          # Manual dry-run option
          DRY_RUN: ${{ inputs.dry_run || 'false' }}

        run: |
          python -m birthday_sms.main

      # ------------------------------------------------------------
      # Persist sent-state
      # ------------------------------------------------------------
      - name: Commit updated sent-state
        if: ${{ (inputs.dry_run || 'false') == 'false' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet -- data/.sent_state.json; then
            git add data/.sent_state.json
            git commit -m "chore: update birthday SMS sent-state [skip ci]"
            git push
          else
            echo "No state changes to commit."
          fi