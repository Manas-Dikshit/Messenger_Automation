name: Daily Birthday SMS

# WHY THIS SCHEDULE:
# GitHub Actions cron always runs in UTC. The workflow below fires at
# 02:30 UTC, which is 08:00 IST (Asia/Kolkata, UTC+5:30) - a reasonable
# morning send time. The Python script independently re-resolves
# "today" in the configured BIRTHDAY_TIMEZONE (see date_utils.py), so
# even if GitHub's scheduler jitters by a few minutes, the correct
# calendar day is still used for birthday matching.
#
# If you serve a different timezone, change BOTH the cron expression
# below AND the BIRTHDAY_TIMEZONE repository variable/secret.
on:
  schedule:
    - cron: "30 2 * * *" # 08:00 IST daily
  workflow_dispatch: # allows manual "Run workflow" button in the Actions tab
    inputs:
      dry_run:
        description: "Render messages and log them WITHOUT sending real SMS"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

# Least-privilege permissions: this workflow only needs to read the
# repo and write back the updated "already sent" state file.
permissions:
  contents: write

concurrency:
  group: daily-birthday-sms
  cancel-in-progress: false

jobs:
  send-birthday-sms:
    name: Check birthdays and send SMS
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run birthday SMS script
        env:
          # --- Required secrets (Settings > Secrets and variables > Actions) ---
          SMS_GATEWAY_USERNAME: ${{ secrets.SMS_GATEWAY_USERNAME }}
          SMS_GATEWAY_PASSWORD: ${{ secrets.SMS_GATEWAY_PASSWORD }}
          # --- Optional overrides ---
          SMS_GATEWAY_BASE_URL: ${{ vars.SMS_GATEWAY_BASE_URL }}
          BIRTHDAY_TIMEZONE: ${{ vars.BIRTHDAY_TIMEZONE }}
          BIRTHDAY_CSV_PATH: data/birthdays.csv
          STATE_FILE_PATH: data/.sent_state.json
          LOG_LEVEL: INFO
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          python -m birthday_sms.main

      - name: Commit updated "already sent" state
        # Persists which contacts were messaged today so a re-run (manual
        # or duplicate schedule trigger) on the same day will not send
        # a second SMS to the same person. Skipped entirely on dry runs.
        if: ${{ (github.event.inputs.dry_run || 'false') == 'false' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- data/.sent_state.json; then
            git add data/.sent_state.json
            git commit -m "chore: update birthday SMS sent-state [skip ci]"
            git push
          else
            echo "No state changes to commit."
          fi
