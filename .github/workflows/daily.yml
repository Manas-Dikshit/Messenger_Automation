name: Daily Birthday SMS

# GitHub Actions cron uses UTC.
#
# 18:47 UTC = 00:17 IST (next day).
#
# The workflow intentionally runs shortly AFTER midnight instead of
# starting before midnight and sleeping until midnight.
#
# The minute is deliberately NOT a round number (:00/:15/:30/:45).
# GitHub's own docs warn that scheduled workflows can be delayed or
# even dropped during high-load periods, and "the start of every
# hour" is explicitly called out as a high-load time - everyone else's
# cron piles up there too. An odd offset avoids that pile-up.
# https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#schedule
#
# Flow:
#   00:17 IST
#      ↓
#   GitHub Actions starts
#      ↓
#   Python determines TODAY in BIRTHDAY_TIMEZONE
#      ↓
#   Checks birthdays.csv
#      ↓
#   Sends SMS to today's birthday contacts
#
# This avoids relying on a GitHub Actions runner remaining alive while
# waiting for midnight.

on:
  schedule:
    - cron: "47 18 * * *" # 00:17 IST daily
    - cron: "53 11 * * *" # TEMP full-flow test - 17:23 IST - remove after today
    - cron: "49 12 * * *" # TEMP full-flow test - 18:19 IST - remove after today
    - cron: "44 13 * * *" # TEMP full-flow test - 19:14 IST - remove after today
    - cron: "41 14 * * *" # TEMP full-flow test - 20:11 IST - remove after today
    - cron: "36 15 * * *" # TEMP full-flow test - 21:06 IST - remove after today

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test mode - true means NO real SMS is sent, it only shows what would be sent"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      test_phone_number:
        description: "To test on YOUR phone only: type your number here (e.g. +919876543210). Leave empty to run normally for everyone in the CSV."
        required: false
        default: ""

# The workflow needs to read the repository and update the sent-state file.
permissions:
  contents: write

# Prevent duplicate workflows from running simultaneously.
concurrency:
  group: daily-birthday-sms
  cancel-in-progress: false

jobs:
  send-birthday-sms:
    name: Check birthdays and send SMS
    runs-on: ubuntu-latest

    # The script may sleep up to ~10 minutes (from 23:50 IST until
    # 00:00 IST) before sending, then send to every matching contact
    # with retry/backoff on transient gateway errors - allow headroom
    # for a worst case of many same-day birthdays all needing retries.
    timeout-minutes: 25

    steps:
      # ------------------------------------------------------------
      # Checkout repository
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ------------------------------------------------------------
      # Decide whether this run is a test (manual, with a phone
      # number filled in) or one of the TEMP scheduled full-flow
      # tests above. Real cron/dispatch-with-no-number runs are
      # untouched by any of this. Runs early so both healthcheck
      # pings (start and end) can be gated on it consistently.
      # ------------------------------------------------------------
      - name: Determine test mode
        id: testmode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.test_phone_number }}" ]; then
            echo "is_test=true" >> "$GITHUB_OUTPUT"
            echo "numbers=${{ inputs.test_phone_number }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "53 11 * * *" ] || \
               [ "${{ github.event.schedule }}" = "49 12 * * *" ] || \
               [ "${{ github.event.schedule }}" = "44 13 * * *" ] || \
               [ "${{ github.event.schedule }}" = "41 14 * * *" ] || \
               [ "${{ github.event.schedule }}" = "36 15 * * *" ]; then
            echo "is_test=true" >> "$GITHUB_OUTPUT"
            echo "numbers=+918117050246,+919692771551,+919337344133" >> "$GITHUB_OUTPUT"
          else
            echo "is_test=false" >> "$GITHUB_OUTPUT"
            echo "numbers=" >> "$GITHUB_OUTPUT"
          fi

      # ------------------------------------------------------------
      # Dead-man's-switch: "start" ping. healthchecks.io uses this to
      # measure run duration and detect a hung job that starts but
      # never finishes (a plain end-of-run ping can't catch that - a
      # hung job never reaches the end). Gated the same way as the
      # end ping (real runs only) so test slots never leave a
      # dangling "started but never finished" state on the monitor.
      # ------------------------------------------------------------
      - name: Ping healthcheck - start
        if: ${{ steps.testmode.outputs.is_test == 'false' && secrets.HEALTHCHECK_URL_DAILY != '' }}
        run: |
          curl -fsS -m 10 --retry 3 "${{ secrets.HEALTHCHECK_URL_DAILY }}/start" \
            || echo "Healthcheck start ping failed (non-fatal)."

      # ------------------------------------------------------------
      # Python
      # ------------------------------------------------------------
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # ------------------------------------------------------------
      # Dependencies
      # ------------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      # ------------------------------------------------------------
      # Build a throwaway CSV for a test send (manual, one number,
      # or the TEMP scheduled slots, two hardcoded numbers). Writes
      # outside the repo (runner temp dir) so data/birthdays.csv and
      # data/.sent_state.json are never touched - nothing to commit,
      # nothing to revert.
      # ------------------------------------------------------------
      - name: Build test CSV (test mode only)
        if: ${{ steps.testmode.outputs.is_test == 'true' }}
        env:
          TEST_NUMBERS: ${{ steps.testmode.outputs.numbers }}
          TZ: ${{ vars.BIRTHDAY_TIMEZONE || 'Asia/Kolkata' }}
        run: |
          today=$(date +%Y-%m-%d)
          mkdir -p "$RUNNER_TEMP/birthday_test"
          {
            echo "Name,PhoneNumber,Birthday,Classification,Brief,Address,Enabled,LastSent,MessageTemplate"
            i=1
            IFS=',' read -ra NUMS <<< "$TEST_NUMBERS"
            for num in "${NUMS[@]}"; do
              echo "Test Contact ${i},${num},${today},Test,,,TRUE,,"
              i=$((i+1))
            done
          } > "$RUNNER_TEMP/birthday_test/birthdays.csv"
          echo "Wrote test CSV:"
          cat "$RUNNER_TEMP/birthday_test/birthdays.csv"

      # ------------------------------------------------------------
      # Birthday SMS
      # ------------------------------------------------------------
      - name: Run birthday SMS script
        env:
          # Required secrets
          SMS_GATEWAY_USERNAME: ${{ secrets.SMS_GATEWAY_USERNAME }}
          SMS_GATEWAY_PASSWORD: ${{ secrets.SMS_GATEWAY_PASSWORD }}

          # Optional repository variables
          SMS_GATEWAY_BASE_URL: ${{ vars.SMS_GATEWAY_BASE_URL }}
          BIRTHDAY_TIMEZONE: ${{ vars.BIRTHDAY_TIMEZONE }}

          # Application paths - swapped to the throwaway test CSV/state
          # in test mode (see "Determine test mode" step above),
          # otherwise the real ones.
          BIRTHDAY_CSV_PATH: ${{ steps.testmode.outputs.is_test == 'true' && format('{0}/birthday_test/birthdays.csv', runner.temp) || 'data/birthdays.csv' }}
          STATE_FILE_PATH: ${{ steps.testmode.outputs.is_test == 'true' && format('{0}/birthday_test/state.json', runner.temp) || 'data/.sent_state.json' }}

          # Logging
          LOG_LEVEL: INFO

          # Delivery confirmation polling (optional overrides).
          # The script polls GET /messages/{id} after sending and
          # writes a Markdown report to the run's Summary page via
          # GITHUB_STEP_SUMMARY (set automatically by Actions).
          DELIVERY_POLL_ENABLED: ${{ vars.DELIVERY_POLL_ENABLED }}
          DELIVERY_POLL_INTERVAL_SECONDS: ${{ vars.DELIVERY_POLL_INTERVAL_SECONDS }}
          DELIVERY_POLL_WINDOW_SECONDS: ${{ vars.DELIVERY_POLL_WINDOW_SECONDS }}

          # Manual dry-run option
          DRY_RUN: ${{ inputs.dry_run || 'false' }}

          # GITHUB_EVENT_NAME/GITHUB_SERVER_URL/GITHUB_REPOSITORY/GITHUB_RUN_ID
          # are set automatically by Actions. The cron string that
          # actually fired is NOT auto-exposed, so pass it explicitly -
          # shown in the run summary to help diagnose scheduling delays.
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}

        run: |
          python -m birthday_sms.main

      # ------------------------------------------------------------
      # Persist sent-state
      # ------------------------------------------------------------
      - name: Commit updated sent-state
        if: ${{ (inputs.dry_run || 'false') == 'false' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/.sent_state.json

          if ! git diff --cached --quiet -- data/.sent_state.json; then
            git commit -m "chore: update birthday SMS sent-state [skip ci]"
            git push
          else
            echo "No state changes to commit."
          fi

      # ------------------------------------------------------------
      # Dead-man's-switch monitoring (healthchecks.io) - end ping.
      #
      # GitHub gives no visibility into whether a `schedule` trigger
      # actually fired, or was delayed/dropped (see docs linked at
      # the top of this file). Pinging an external monitor on every
      # REAL run (not test slots) lets it alert us by email if a
      # ping doesn't arrive within the configured schedule + grace
      # period - the only way to catch a silently dropped trigger.
      # Paired with the "start" ping above, healthchecks.io also
      # measures run duration and flags a hung job that starts but
      # never reaches this step.
      #
      # The run summary body is attached to the ping (healthchecks.io
      # stores the last ~10KB of a ping's body and shows it in the
      # ping log), so the same status/timestamp/error detail visible
      # on the GitHub Summary page is also visible there.
      #
      # No-op if HEALTHCHECK_URL_DAILY secret isn't set.
      # ------------------------------------------------------------
      - name: Ping healthcheck - end (real runs only)
        if: ${{ always() && steps.testmode.outputs.is_test == 'false' && secrets.HEALTHCHECK_URL_DAILY != '' }}
        run: |
          url="${{ secrets.HEALTHCHECK_URL_DAILY }}"
          if [ "${{ job.status }}" != "success" ]; then
            url="${url}/fail"
          fi
          if [ -f "$GITHUB_STEP_SUMMARY" ]; then
            curl -fsS -m 10 --retry 3 --data-binary "@$GITHUB_STEP_SUMMARY" "$url" \
              || echo "Healthcheck ping failed (non-fatal)."
          else
            curl -fsS -m 10 --retry 3 "$url" || echo "Healthcheck ping failed (non-fatal)."
          fi