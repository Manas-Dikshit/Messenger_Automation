name: Lint and Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    name: Lint GitHub Actions workflow files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Catches GitHub Actions schema violations that generic YAML
      # parsing can't - e.g. using an invalid context (like `secrets`)
      # inside a step's `if:` condition. That exact bug silently broke
      # daily.yml and cron_ping.yml in production for ~2.5 hours before
      # this check existed (see commit 7cf9890 for the fix and story).
      - name: Install actionlint
        run: pip install actionlint-py

      - name: Run actionlint
        run: actionlint .github/workflows/*.yml

  lint-and-test:
    name: Lint and test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Check formatting with Black
        run: black --check --diff src tests

      - name: Check import order with isort
        run: isort --check-only --diff src tests

      - name: Lint with flake8
        run: flake8 src tests --max-line-length=100 --extend-ignore=E203

      - name: Run tests with pytest
        env:
          # Dummy credentials so config-loading tests don't fail on
          # missing secrets in CI - no real network calls are made.
          SMS_GATEWAY_USERNAME: ci_test_user
          SMS_GATEWAY_PASSWORD: ci_test_password
        run: pytest --cov=birthday_sms --cov-report=term-missing
